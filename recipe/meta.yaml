{% set name = "jupyter-archive" %}
{% set version = "3.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ca6e5eefbc562fe0c7709f1da3027c66cccc0eac35b5d31efe337abc637bd859

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling >=1.5.0
    - hatch-jupyter-builder >=0.5
    - hatch-nodejs-version
    - jupyterlab >=4.0.0,<5
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - jupyter_server >=1.21,<3.0.0

test:
  requires:
    - jupyterlab >=4.0.0,<5
    - pip
    - python {{ python_min }}
  imports:
    - jupyter_archive
  commands:
    - pip check
    - jupyter server extension list 2>&1 | grep -ie "jupyter_archive.*OK"
    - jupyter labextension list 2>&1 | grep -ie "@hadim/jupyter-archive.*OK"

about:
  home: https://github.com/jupyterlab-contrib/jupyter-archive
  summary: A JupyterLab extension to make, download and extract archive files.
  description: A JupyterLab extension to make, download and extract archive files.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fcollonval
